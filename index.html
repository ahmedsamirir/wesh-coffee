<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wesh · Specialty coffee with an Egyptian soul</title>
<meta name="description" content="Preview of the Wesh specialty coffee website. Degla, Maadi. Opening 2028.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1C1A18">
<meta property="og:title" content="Wesh · وِش · Specialty coffee">
<meta property="og:description" content="Coffee with an Egyptian soul. Preview site, opening 2028 in Degla, Maadi.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%231C1A18%22/%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2222%22%20r%3D%229%22%20fill%3D%22%23D27245%22/%3E%3Ccircle%20cx%3D%2220%22%20cy%3D%2242%22%20r%3D%229%22%20fill%3D%22%23D27245%22/%3E%3Ccircle%20cx%3D%2244%22%20cy%3D%2242%22%20r%3D%229%22%20fill%3D%22%23D27245%22/%3E%3C/svg%3E">
<link rel="preload" href="fonts/Unbounded-ExtraBold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ReadexPro-Regular.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Aref Ruqaa';src:url(fonts/ArefRuqaa-Bold.woff2) format('woff2');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Barlow Condensed';src:url(fonts/BarlowCondensed-SemiBold.woff2) format('woff2');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'Lalezar';src:url(fonts/Lalezar-Regular.woff2) format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Readex Pro';src:url(fonts/ReadexPro-Regular.woff2) format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Readex Pro';src:url(fonts/ReadexPro-SemiBold.woff2) format('woff2');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'Unbounded';src:url(fonts/Unbounded-ExtraBold.woff2) format('woff2');font-weight:800;font-style:normal;font-display:swap}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}

/* Layout: sticky bar on top, one 1200px column, dark hero and footer around foam-coloured pages. Single committed brand look (no dark theme). */
:root{
  --roast:#1C1A18; --basalt:#2B2825; --crema:#F2E6D0; --foam:#FAF5EC; --glow:#D27245; --copper:#A84E2A; --brass:#C9A36A; --sand:#D9CBB4;
  --muted:#6B6258; --muted-d:#B3A898; --line:#E2D6C0; --ok:#2F6B3E;
  --f-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --f-label:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Readex Pro','Segoe UI',Tahoma,system-ui,sans-serif;
  --f-ar:'Aref Ruqaa','Readex Pro',serif;
  --f-fun:'Lalezar','Readex Pro',system-ui,sans-serif;
  --gut-l:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--foam);color:var(--roast);font-family:var(--f-body);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--roast)}
a{color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:800;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
[dir=rtl] h1,[dir=rtl] h2{font-family:var(--f-ar);font-weight:700;letter-spacing:0;line-height:1.35}
[dir=rtl] h3{font-family:var(--f-body);font-weight:600;letter-spacing:0;line-height:1.4}
h1,h2,h3{overflow-wrap:break-word;min-width:0}
h1{font-size:clamp(30px,6vw,58px)} h2{font-size:clamp(24px,3.4vw,32px)} h3{font-size:18px}
p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.lab{font-family:var(--f-label);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
[dir=rtl] .lab{font-family:var(--f-body);letter-spacing:0;font-size:12.5px}
.muted{color:var(--muted)}
svg{display:block;max-width:100%;height:auto;direction:ltr}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
/* test banner + header */
.banner{background:var(--copper);color:var(--foam);font-size:13px;text-align:center;padding-block:7px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--foam);border-bottom:1px solid var(--line)}
header.dark{background:var(--roast);color:var(--crema);border-color:#3a3632}
.bar{display:flex;align-items:center;gap:18px;height:64px}
.logo img{height:26px;width:auto;display:block}
nav.main{display:flex;gap:22px;margin-inline-start:18px;flex:1}
nav.main a{text-decoration:none;font-size:14.5px;padding:6px 0;border-bottom:2px solid transparent}
nav.main a[aria-current=page]{border-color:var(--glow)}
.tools{display:flex;align-items:center;gap:12px;margin-inline-start:auto}
.lang{background:none;border:1px solid currentColor;color:inherit;border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer;opacity:.85}
.baglink{text-decoration:none;font-size:14.5px;white-space:nowrap}
.baglink b{display:inline-block;min-width:22px;text-align:center;background:var(--glow);color:var(--roast);border-radius:999px;font-size:12px;padding:1px 6px;margin-inline-start:4px}
.burger{display:none;background:none;border:0;color:inherit;font-size:24px;line-height:1;cursor:pointer;padding:6px}
.btn{font-family:var(--f-body);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:999px;border:2px solid var(--roast);background:var(--roast);color:var(--foam);cursor:pointer;text-decoration:none;min-height:46px}
.btn.copper{background:var(--glow);border-color:var(--glow);color:var(--roast)}
.btn.ghost{background:transparent;color:inherit;border-color:currentColor}
.btn.sm{padding:7px 16px;font-size:13.5px;min-height:36px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
/* hero (option A: the foam line) */
.heroA{position:relative;overflow:hidden;background:var(--roast);color:var(--crema);text-align:center}
.heroA .pat{position:absolute;inset:0;width:100%;height:100%;max-width:none;opacity:.07;pointer-events:none}
.heroA .inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:60px;max-width:960px}
.heroA .arbig{font-family:var(--f-ar);font-weight:700;font-size:clamp(56px,9vw,104px);line-height:1.25;color:var(--crema)}
.heroA h1{font-size:clamp(28px,4vw,46px);line-height:1.12}
.heroA h1 em{font-style:normal;color:var(--glow)}
.heroA p{max-width:560px;color:var(--muted-d);font-size:clamp(15px,1.6vw,18px)}
.shelf{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:clamp(10px,2.4vw,28px);margin-top:48px;margin-bottom:clamp(-90px,-5vw,-28px);padding-inline:16px}
.shelf a{display:block;width:clamp(96px,15vw,210px);flex:none;transition:transform .25s ease}
.shelf a svg{width:100%;height:auto}
.shelf a:nth-child(1){width:clamp(88px,13.5vw,190px);transform:rotate(-6deg) translateY(18px)}
.shelf a:nth-child(2){transform:rotate(-2deg)}
.shelf a:nth-child(3){transform:rotate(3deg)}
.shelf a:nth-child(4){width:clamp(88px,13.5vw,190px);transform:rotate(7deg) translateY(18px)}
.shelf a:hover,.shelf a:focus-visible{transform:translateY(-10px) rotate(0)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
section.blk{padding-block:56px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.sechead a{font-family:var(--f-label);letter-spacing:.14em;text-transform:uppercase;font-size:13px;text-decoration:none;color:var(--copper)}
/* cards */
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.card .pic{--pad:22px;background:var(--crema);display:block;position:relative;aspect-ratio:1/1;text-decoration:none}
.card .pic svg{position:absolute;inset:var(--pad);width:calc(100% - 2 * var(--pad));height:calc(100% - 2 * var(--pad))}
.card .info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .info .lab{color:var(--copper);font-size:12px}
.card h3{font-size:16px;line-height:1.25}
.card .notes{font-size:13.5px;color:var(--muted)}
.card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px;gap:8px}
.price{font-weight:600}
.chip{font:inherit;font-size:13.5px;border:1.5px solid var(--roast);background:transparent;color:var(--roast);border-radius:999px;padding:6px 14px;cursor:pointer;min-height:36px}
.chip[aria-pressed=true]{background:var(--roast);color:var(--foam)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:inline-block;font-family:var(--f-label);font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:var(--glow);color:var(--roast);padding:2px 9px;border-radius:999px}
/* story teaser */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--crema)}
.split .art{min-height:300px;position:relative;overflow:hidden}
.split .art svg{position:absolute;inset:0;width:100%;height:100%}
.wsband{background:var(--roast);color:var(--crema)}
.wsband .art{display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,2vw,22px);padding:40px 24px 0;background:var(--basalt)}
.wsband .art a{display:block;width:clamp(84px,11vw,150px);flex:none}
.wsband .art a svg{position:static;width:100%;height:auto}
.wsband .art a:nth-child(1){transform:rotate(-5deg) translateY(10px)}.wsband .art a:nth-child(3){transform:rotate(5deg) translateY(10px)}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{border:1.5px solid #4a4540;border-radius:999px;padding:6px 13px;font-size:13.5px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}
.steps li{display:flex;gap:14px;align-items:flex-start}
.steps .n{flex:none;width:38px;height:38px;border-radius:999px;background:var(--glow);color:var(--roast);font-family:var(--f-display);font-weight:800;display:flex;align-items:center;justify-content:center}
.wsform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.wsform .full{grid-column:1/-1}
select{font:inherit;border:1.5px solid var(--sand);background:#fff;color:var(--roast);padding:11px 12px;width:100%;border-radius:2px;min-height:46px}
.split .txt{padding:44px 40px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.dark{background:var(--roast);color:var(--crema)}
.posts svg{width:100%}
/* shop layout */
.shop{display:grid;grid-template-columns:230px minmax(0,1fr);gap:34px;align-items:start}
.filters{display:flex;flex-direction:column;gap:18px}
.filters h4{margin:0 0 8px;font-family:var(--f-label);letter-spacing:.14em;text-transform:uppercase;font-size:13px;font-weight:600}
.crumb{font-family:var(--f-label);letter-spacing:.14em;text-transform:uppercase;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.crumb a{text-decoration:none}
/* product */
.prod{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:44px;align-items:start}
.prod .pic{background:var(--crema);padding:40px;display:flex;justify-content:center}
.prod .pic svg{width:min(320px,80%)}
.opt{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--roast);border-radius:999px;overflow:hidden}
.qty button{background:none;border:0;font:inherit;font-size:18px;width:40px;height:42px;cursor:pointer;color:inherit}
.qty span{min-width:28px;text-align:center;font-weight:600}
.recipe{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.recipe div{background:var(--roast);color:var(--crema);padding:12px}
.recipe b{display:block;font-family:var(--f-display);font-size:18px}
.recipe .lab{font-size:11px;color:var(--brass)}
table.kv{border-collapse:collapse;width:100%;font-size:14.5px}
table.kv td{padding:9px 0;border-top:1px solid var(--line)}
table.kv td:first-child{color:var(--muted);width:40%}
/* story */
.timeline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.timeline div{border-top:3px solid var(--glow);padding-top:12px}
.timeline b{font-family:var(--f-display);font-size:20px;display:block}
[dir=rtl] .timeline b{font-family:var(--f-ar)}
.tile{background:var(--crema);padding:24px}
/* community */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:start}
.posts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.event{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.event .day{background:var(--roast);color:var(--crema);font-family:var(--f-label);letter-spacing:.1em;padding:6px 10px;min-width:54px;text-align:center}
.event .t{flex:1;min-width:0}
.club{background:var(--roast);color:var(--crema);padding:28px;margin-top:26px}
.field{display:flex;flex-direction:column;gap:5px;font-size:14px}
input[type=text],input[type=tel],input[type=email],textarea{font:inherit;border:1.5px solid var(--sand);background:#fff;color:var(--roast);padding:11px 12px;width:100%;border-radius:2px}
textarea{min-height:84px;resize:vertical}
.club input{border-color:#4a4540;background:var(--basalt);color:var(--crema)}
.note{font-size:13px;color:var(--muted)}
.stickers{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.stickers svg{width:92px}
/* visit */
.visit{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:start}
.map{background:var(--crema);border:1px solid var(--line)}
.menu{background:var(--roast);color:var(--crema);padding:26px}
.menu .li{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid #3a3632;font-size:15px}
.menu .li span:last-child{color:var(--glow);font-weight:600}
/* bag */
.bagrow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.bagrow .th{background:var(--crema);padding:6px;height:72px;display:flex;justify-content:center}
.bagrow .th svg{height:100%;width:100%}
.linkbtn{background:none;border:0;color:var(--copper);font:inherit;font-size:13px;cursor:pointer;padding:4px 0;text-decoration:underline}
.sum{background:#fff;border:1px solid var(--line);padding:22px}
.sum .li{display:flex;justify-content:space-between;padding:6px 0}
.sum .tot{font-weight:600;font-size:18px;border-top:2px solid var(--roast);margin-top:8px;padding-top:12px}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.seg button{font:inherit;font-size:14.5px;border:1.5px solid var(--roast);background:#fff;color:var(--roast);padding:12px;cursor:pointer;text-align:start;min-height:48px}
.seg button[aria-pressed=true]{background:var(--roast);color:var(--foam)}
.err{color:#A32B1B;font-size:14px;min-height:1.4em}
.stars{display:flex;gap:4px}
.stars button{background:none;border:0;font-size:30px;line-height:1;cursor:pointer;color:var(--sand);padding:2px}
.stars button.on{color:var(--glow)}
footer{background:var(--roast);color:var(--crema);margin-top:40px}
footer .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.4fr;gap:34px;padding-block:48px}
footer a{text-decoration:none;display:block;padding:3px 0;color:var(--muted-d)}
footer h4{margin:0 0 10px;font-family:var(--f-label);letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--brass);font-weight:600}
footer .fine{border-top:1px solid #3a3632;padding-block:16px;font-size:12.5px;color:var(--muted-d)}
.slogan-ar{font-family:var(--f-ar);font-size:30px;color:var(--glow);line-height:1.3}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--roast);color:var(--crema);padding:12px 20px;border-radius:999px;font-size:14.5px;opacity:0;pointer-events:none;transition:.25s;z-index:80;box-shadow:0 8px 24px #0005;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:980px){
  nav.main{display:none;position:absolute;top:64px;inset-inline:0;background:var(--foam);flex-direction:column;gap:0;margin:0;padding:8px var(--gut-r) 16px var(--gut-l);border-bottom:1px solid var(--line)}
  header.open nav.main{display:flex} header.dark nav.main{background:var(--roast);border-color:#3a3632} nav.main a{padding:12px 0;font-size:16px}
  .burger{display:block} .tools .order{display:none}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))} .grid6{grid-template-columns:repeat(3,minmax(0,1fr))} .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split,.prod,.two,.visit,.shop,.wsform{grid-template-columns:minmax(0,1fr)}
  
  .split .txt{padding:30px 22px} .timeline{grid-template-columns:repeat(2,minmax(0,1fr))}
  footer .cols{grid-template-columns:1fr 1fr}
  .filters{flex-direction:row;flex-wrap:wrap;gap:14px 24px}
}
@media (max-width:520px){
  .shelf a:nth-child(4){display:none} .heroA .inner{padding-top:40px} .shelf{margin-top:36px}
  .grid3,.vals{grid-template-columns:minmax(0,1fr)} .recipe{grid-template-columns:repeat(2,1fr)} footer .cols{grid-template-columns:1fr}
  .card .pic{--pad:14px} .card .foot{flex-direction:column;align-items:stretch} .bar{gap:10px}
  .prod .pic{padding:24px}
  .grid4.who{grid-template-columns:minmax(0,1fr)} .wsmascot{display:none}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.toast{transition:none}.shelf a{transition:none}}
</style>
</head>
<body>
<noscript><p style="padding:20px">This preview needs JavaScript turned on.</p></noscript>

<div class="banner"><div class="wrap" id="banner"></div></div>
<header id="hdr"><div class="wrap bar">
  <a class="logo" href="#home" aria-label="Wesh home"><img id="logoimg" alt="Wesh"></a>
  <nav class="main" id="nav" aria-label="Main"></nav>
  <div class="tools">
    <button class="lang" id="lang" type="button"></button>
    <a class="baglink" href="#bag" id="baglink"></a>
    <a class="btn copper sm order" href="#shop" id="orderbtn"></a>
    <button class="burger" id="burger" type="button" aria-label="Menu" aria-expanded="false">☰</button>
  </div>
</div></header>
<main id="app"></main>
<footer><div class="wrap" id="foot"></div></footer>

    <button class="btn copper" type="button" data-act="place" style="width:100%;margin-top:6px">${L('Place test order', 'اطلب (تجريبي)')} · ${egp(subtotal() + del)}</button></div>
  <div class="sum"><h2>${L('Your bag', 'شنطتك')} (${count()})</h2><div style="margin-top:10px">${bag.map((b, i) => `<div class="bagrow"><div class="th">${A[b.art] || ''}</div><div><b style="font-size:15px">${esc(L(b.name, b.ar))}</b><div class="note">${esc(L(b.opt, b.optAr))}</div>
      <div class="row" style="margin-top:6px;gap:10px"><div class="qty" style="transform:scale(.86);transform-origin:left"><button type="button" data-act="bq" data-i="${i}" data-d="-1" aria-label="${L('Less', 'أقل')}">−</button><span>${b.qty}</span><button type="button" data-act="bq" data-i="${i}" data-d="1" aria-label="${L('More', 'أكتر')}">+</button></div><button type="button" class="linkbtn" data-act="rm" data-i="${i}">${L('Remove', 'شيل')}</button></div></div><div class="price">${egp(b.price * b.qty)}</div></div>`).join('')}</div>
    <div style="border-top:1px solid var(--line);margin-top:6px;padding-top:10px"><div class="li"><span>${L('Subtotal', 'المجموع')}</span><span>${egp(subtotal())}</span></div><div class="li"><span>${co.mode === 'delivery' ? L('Delivery', 'التوصيل') : L('Pickup', 'الاستلام')}</span><span>${del ? egp(del) : L('Free', 'مجاناً')}</span></div>
    <div class="li tot"><span>${L('Total', 'الإجمالي')}</span><span>${egp(subtotal() + del)}</span></div></div>
    <p class="note" style="margin-top:12px;background:var(--crema);padding:10px 12px">+${count()} ${L('stamps in Kanaka Club with this order', 'ختم في نادي الكنكة بالطلب ده')}</p></div></div></div></section>`;
};

V.done = () => {
  const o = lastOrder; if (!o) return V.bag();
  return `<section class="blk"><div class="wrap" style="max-width:720px"><div style="width:150px">${A.mascot_wave}</div>
  <div class="lab" style="color:var(--copper);margin-top:16px">${L('Test order', 'طلب تجريبي')} ${o.no}</div><h1 style="font-size:clamp(30px,5vw,44px);margin-top:6px">${L('Always bel-wesh, ', 'دايمًا بالوش يا ')}${esc(o.name.split(' ')[0])}${L('.', '')}</h1>
  <p style="margin-top:12px">${L('This is a preview of the Wesh website, so nothing was charged, saved or sent. In the real shop you would now get a WhatsApp confirmation.', 'ده عرض تجريبي لموقع وش، فمفيش حاجة اتدفعت أو اتسجلت أو اتبعتت. في المتجر الحقيقي هيوصلك تأكيد على واتساب.')}</p>
  <div class="sum" style="margin-top:22px"><div class="li"><span>${L('Items', 'المنتجات')}</span><span>${o.count}</span></div><div class="li"><span>${o.mode === 'delivery' ? L('Delivery in Maadi', 'توصيل في المعادي') : L('Pickup at Wesh, ready in about 15 min', 'استلام من وش، جاهز في حوالي 15 دقيقة')}</span><span>${o.del ? egp(o.del) : L('Free', 'مجاناً')}</span></div>
  <div class="li tot"><span>${L('Total', 'الإجمالي')}</span><span>${egp(o.total)}</span></div></div>
  <div class="row" style="margin-top:22px"><a class="btn" href="#shop">${L('Keep shopping', 'كمّل تسوق')}</a><a class="btn ghost" href="#reviews">${L('Give feedback on the site', 'قول رأيك في الموقع')}</a></div></div></section>`;
};

/* ---------- chrome + router ---------- */
function route(){ const h = (location.hash || '#home').slice(1); if (h.startsWith('coffee-')) return ['coffee', h.slice(7)]; return [V[h] ? h : 'home']; }
function chrome(){
  const [r] = route(), dark = r === 'home' || r === 'story';
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  $('#hdr').className = dark ? 'dark' : '';
  $('#logoimg').src = dark ? A.logo_light : A.logo_dark;
  $('#banner').textContent = L('Preview site for testing. Wesh opens in 2028, so orders here are not real and prices are placeholders.', 'موقع تجريبي للاختبار. وش هيفتح في 2028، فالطلبات هنا مش حقيقية والأسعار مبدئية.');
  $('#nav').innerHTML = NAV.map(n => `<a href="#${n[0]}" ${(r === n[0] || (r === 'coffee' && n[0] === 'shop')) ? 'aria-current="page"' : ''}>${L(n[1], n[2])}</a>`).join('');
  $('#lang').textContent = lang === 'ar' ? 'English' : 'عربي';
  $('#baglink').innerHTML = `${L('Bag', 'الشنطة')}<b>${count()}</b>`;
  $('#orderbtn').textContent = L('Order ahead', 'اطلب قبل ما تيجي');
  $('#foot').innerHTML = `<div class="cols"><div><img src="${A.logo_light}" alt="Wesh" style="height:30px"><div class="slogan-ar" style="margin-top:14px">دايمًا بالوش</div><div class="lab" style="color:var(--muted-d)">Always bel-wesh</div></div>
   <div><h4>${L('Shop', 'المتجر')}</h4><a href="#shop">${L('Coffee', 'القهوة')}</a><a href="#merch">${L('Merch', 'ميرش')}</a><a href="#wholesale">${L('Wholesale', 'الجملة')}</a><a href="#bag">${L('Bag', 'الشنطة')}</a></div>
   <div><h4>${L('Wesh', 'وش')}</h4><a href="#story">${L('Our story', 'حكايتنا')}</a><a href="#community">${L('Community', 'المجتمع')}</a><a href="#visit">${L('Visit', 'زورنا')}</a><a href="#reviews">${L('Reviews', 'الآراء')}</a></div>
   <div><h4>${L('Find us', 'مكاننا')}</h4><p style="color:var(--muted-d);font-size:14.5px">${L('Road 9 area, Degla, Maadi, Cairo', 'منطقة شارع 9، دجلة، المعادي، القاهرة')}<br>@wesh.eg · #دايمًا_بالوش</p></div></div>
   <div class="fine">${L('Preview build, November 2026. Prices, hours, the address and social handles are placeholders. Bakery by Loulis.', 'نسخة تجريبية، نوفمبر 2026. الأسعار والمواعيد والعنوان وحسابات السوشيال مبدئية. المخبوزات من لوليس.')}</div>`;
}
function render(keepScroll){
  const [r, arg] = route();
  chrome(); $('#app').innerHTML = V[r](arg);
  $('#hdr').classList.remove('open'); $('#burger').setAttribute('aria-expanded', 'false');
  if (!keepScroll) window.scrollTo(0, 0);
}
function readCo(){ ['name', 'phone', 'addr'].forEach(k => { const el = document.getElementById('co-' + k); if (el) co[k] = el.value.trim(); }); }
function fbText(){
  const g = id => (document.getElementById(id) || {}).value || '';
  return [`Wesh website feedback from ${g('fbname').trim() || 'a friend'}`, `Rating: ${fbStars || '–'}/5`, g('fblike').trim() && `Liked: ${g('fblike').trim()}`, g('fbfix').trim() && `Confusing or missing: ${g('fbfix').trim()}`].filter(Boolean).join('\n');
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, d = el.dataset;
  if (a === 'quick' || a === 'addcoffee') {
    const c = COFFEES.find(x => x.id === d.id), quick = a === 'quick';
    const size = quick ? '250' : sel.size, grind = quick ? 'Whole bean' : sel.grind, p = size === '1000' ? price1kg(c.price) : c.price;
    addToBag({key:`${c.id}|${size}|${grind}`, name:c.name, ar:c.ar, art:'pack_' + c.id, opt:`${size === '1000' ? '1 kg' : '250 g'} · ${grind}`, optAr:`${size === '1000' ? '1 كجم' : '250 جم'} · ${tr[grind] || grind}`, price:p, qty:quick ? 1 : sel.qty});
    if (!quick) { sel.qty = 1; render(true); }
  } else if (a === 'addmerch') {
    const m = MERCH.find(x => x.id === d.id), s = m.sizes ? (sel.msize[m.id] || 'M') : '';
    addToBag({key:`${m.id}|${s}`, name:m.name, ar:m.ar, art:'m_' + m.id, opt:s ? `Size ${s}` : 'One size', optAr:s ? `مقاس ${s}` : 'مقاس واحد', price:m.price, qty:1});
  } else if (a === 'ws') { wsRead(); ws[d.k] = d.v; render(true); }
  else if (a === 'wsjump') { const t = $('#ws-inquiry'); if (t) t.scrollIntoView({behavior:'smooth'}); }
  else if (a === 'wsreset') { ws = {name:'', biz:'', phone:'', kg:'5–10', type:'cafe', freq:'', msg:'', sent:false}; render(true); }
  else if (a === 'wssend') {
    wsRead(); const err = $('#ws-err');
    if (ws.name.length < 2) { err.textContent = L('Add your name so we know who to reply to.', 'اكتب اسمك عشان نعرف نرد على مين.'); $('#ws-name').focus(); return; }
    if (ws.phone.replace(/\D/g, '').length < 10) { err.textContent = L('Add a WhatsApp number we can reach you on.', 'اكتب رقم واتساب نقدر نوصلك عليه.'); $('#ws-phone').focus(); return; }
    if (!ws.freq) { err.textContent = L('Pick how often you would order.', 'اختار هتطلب كل قد إيه.'); return; }
    ws.sent = true; render(true); const t = $('#ws-inquiry'); if (t) t.scrollIntoView();
  } else if (a === 'msize') { sel.msize[d.id] = d.v; render(true); }
  else if (a === 'cat') { filt.cat = d.v; render(true); }
  else if (a === 'filt') { filt[d.k] = filt[d.k] === d.v ? '' : d.v; render(true); }
  else if (a === 'clear') { filt = {cat:'all', roast:'', process:'', country:''}; render(true); }
  else if (a === 'sel') { sel[d.k] = d.v; render(true); }
  else if (a === 'pq') { sel.qty = Math.max(1, Math.min(10, sel.qty + +d.d)); render(true); }
  else if (a === 'bq') { readCo(); const b = bag[+d.i]; b.qty += +d.d; if (b.qty < 1) bag.splice(+d.i, 1); save(); render(true); }
  else if (a === 'rm') { readCo(); bag.splice(+d.i, 1); save(); render(true); }
  else if (a === 'co') { readCo(); co[d.k] = d.v; render(true); }
  else if (a === 'place') {
    readCo(); const err = $('#co-err');
    if (co.name.length < 2) { err.textContent = L('Enter your name so we know who the order is for.', 'اكتب اسمك عشان نعرف الطلب لمين.'); $('#co-name').focus(); return; }
    if (co.phone.replace(/\D/g, '').length < 8) { err.textContent = L('Enter a mobile number we can reach you on.', 'اكتب رقم موبايل نقدر نوصلك عليه.'); $('#co-phone').focus(); return; }
    if (co.mode === 'delivery' && co.addr.length < 5) { err.textContent = L('Enter your delivery address in Maadi.', 'اكتب عنوان التوصيل في المعادي.'); $('#co-addr').focus(); return; }
    const del = co.mode === 'delivery' ? 40 : 0;
    lastOrder = {no:'T-' + String(Math.floor(1000 + Math.random() * 9000)), name:co.name, mode:co.mode, del, count:count(), total:subtotal() + del};
    bag = []; save(); location.hash = '#done';
  }
  else if (a === 'rsvp') { rsvp[d.i] = !rsvp[d.i]; render(true); if (rsvp[d.i]) toast(L('You’re on the list (preview only)', 'اسمك اتسجل (تجريبي)')); }
  else if (a === 'join') { const v = ($('#clubphone').value || '').replace(/\D/g, ''); $('#clubnote').textContent = v.length < 8 ? L('Enter a mobile number to join.', 'اكتب رقم موبايل عشان تنضم.') : L('Welcome to the Kanaka Club. Preview only: nothing was saved or sent.', 'أهلاً بيك في نادي الكنكة. ده تجريبي: مفيش حاجة اتسجلت أو اتبعتت.'); }
  else if (a === 'star') { fbStars = +d.n; document.querySelectorAll('.stars button').forEach(b => { b.classList.toggle('on', +b.dataset.n <= fbStars); b.setAttribute('aria-pressed', +b.dataset.n === fbStars); }); }
  else if (a === 'fbcopy') {
    const txt = fbText(), note = $('#fbnote'), ok = () => note.textContent = L('Copied. Paste it in a message to Ahmed.', 'اتنسخ. الصقه في رسالة لأحمد.'), fail = () => note.textContent = txt;
    try { navigator.clipboard.writeText(txt).then(ok, fail); } catch (err) { fail(); }
  }
  else if (a === 'fbwa') { el.href = 'https://wa.me/?text=' + encodeURIComponent(fbText()); }
});
$('#lang').addEventListener('click', () => { readCo(); lang = lang === 'ar' ? 'en' : 'ar'; save(); render(true); });
$('#burger').addEventListener('click', () => { const o = $('#hdr').classList.toggle('open'); $('#burger').setAttribute('aria-expanded', o); });
window.addEventListener('hashchange', () => render());
render(true);
</script>

</body>
</html>
